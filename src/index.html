<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="./index.css" type="text/css" rel="stylesheet" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />

    <title>pepsi's custom rom site</title>
  </head>

  <body
    class="m-0 min-h-[99vh] bg-black bg-cover bg-no-repeat p-0 font-sans text-white"
  >
    <main class="m-10 w-2/3 bg-sky-950/30 md:m-20">
      <h1 class="pb-2 text-2xl">pepsi's custom rom site</h1>

      <p>current support:</p>
      <ul>
        <li>blissroms</li>
        <li>calyxos (dead)</li>
        <li>derpfest</li>
        <li>/e/ os</li>
        <li>elixiros</li>
        <li>grapheneos</li>
        <!-- <li>infinity_x</li> -->
        <li>iode_os</li>
        <li>lineageos</li>
      </ul>

      <table id="datatable" class="table">
        <thead>
          <tr>
            <th>name</th>
            <th>vendor</th>
            <th>codename</th>
            <th>support</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </main>
    <script src="script/script.ts" type="module"></script>
  </body>
</html>
