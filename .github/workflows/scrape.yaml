name: Daily Tasks

on:
  schedule:
    # Run at 6 AM UTC every day
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  daily-security-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run security scan
        run: |
          npm audit --audit-level=high
          echo "Security scan completed at $(date)"
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Install dependencies
        run: python -m pip install --upgrade pip setuptools wheel requests beautifulsoup4 jsonpickle
      - name: Scrape
        run: python scrapers/scrape.py > data.json
